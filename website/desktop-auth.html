<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowAI — Desktop Google Authentication</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #030508;
      --card-bg: rgba(6, 12, 9, 0.95);
      --accent-green: #00ff66;
      --accent-cyan: #00e5ff;
      --text-main: #e2fced;
      --text-muted: #7ca88e;
      --border-glow: rgba(0, 255, 102, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,255,102,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 0 40px rgba(0, 255, 102, 0.12), inset 0 0 20px rgba(0, 255, 102, 0.03);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid rgba(0, 255, 102, 0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      color: var(--accent-green);
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }
    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .google-btn {
      width: 100%;
      background: #ffffff;
      color: #1f1f1f;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .google-btn:hover {
      background: #f1f3f4;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,255,255,0.2);
    }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    .status-box {
      display: none;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }
    .user-profile-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .avatar-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--accent-green);
      object-fit: cover;
    }
    .user-meta-name {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    .user-meta-email {
      font-size: 12px;
      color: var(--text-muted);
    }
    .tier-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .tier-pro {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }
    .tier-free {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
    }
    .status-msg {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,255,102,0.3);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-tag">
      <img src="favicon.svg" alt="ShadowAI" style="width:16px;height:16px;filter:drop-shadow(0 0 6px #00ff66);vertical-align:middle;">
      <span>SHADOW AI CLOUD AUTH</span>
    </div>

    <h1 class="title">Desktop Sign In</h1>
    <p class="subtitle">Authenticate with your Google account to sync your Pro license & activate Cloud Vision.</p>

    <!-- Google Sign In Button -->
    <button id="btn-google-login" class="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.93 6.72-4.93z"/>
      </svg>
      Sign in with Google
    </button>

    <!-- Live Status / Connected Card -->
    <div id="status-box" class="status-box">
      <div class="user-profile-row">
        <img id="user-avatar" class="avatar-img" src="" alt="Google Avatar" style="display:none;">
        <div style="flex:1;">
          <div id="user-name" class="user-meta-name">Loading User...</div>
          <div id="user-email" class="user-meta-email">user@gmail.com</div>
          <div id="user-tier" class="tier-badge tier-pro">PRO ACTIVE</div>
        </div>
      </div>
      <div id="status-msg" class="status-msg">
        <span class="spinner"></span> Connecting to ShadowAI Desktop...
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kptqmelofgromeavgmip.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6l5uraxvTrrsbV9PKVJOPg_iKJCqf_J';
    const ADMIN_WHITELIST = ['harshilthakur82@gmail.com', 'harshilthakur82@oksbi', 'harshil1a'];

    const params = new URLSearchParams(window.location.search);
    let port = params.get('port') || sessionStorage.getItem('shadow_desktop_port') || '18234';
    if (params.get('port')) {
      sessionStorage.setItem('shadow_desktop_port', port);
    }

    const supabaseClient = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const btnGoogle = document.getElementById('btn-google-login');
    const statusBox = document.getElementById('status-box');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const userTier = document.getElementById('user-tier');
    const statusMsg = document.getElementById('status-msg');

    if (btnGoogle && supabaseClient) {
      btnGoogle.addEventListener('click', async () => {
        btnGoogle.innerHTML = '<span class="spinner"></span> Redirecting to Google...';
        btnGoogle.disabled = true;
        try {
          await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + window.location.pathname + '?port=' + port
            }
          });
        } catch(err) {
          alert('Google Sign-In Error: ' + err.message);
          btnGoogle.disabled = false;
          btnGoogle.innerText = 'Sign in with Google';
        }
      });
    }

    async function handleAuthenticatedUser(user) {
      if (!user || !user.email) return;

      btnGoogle.style.display = 'none';
      statusBox.style.display = 'block';

      const email = user.email.trim();
      const meta = user.user_metadata || {};
      const name = meta.full_name || meta.name || email.split('@')[0];
      const avatar = meta.avatar_url || '';

      userName.innerText = name.toUpperCase();
      userEmail.innerText = email;
      if (avatar) {
        userAvatar.src = avatar;
        userAvatar.style.display = 'block';
      }

      // Check Pro status & hardware binding in database
      const isMasterAdmin = ADMIN_WHITELIST.some(a => email.toLowerCase().includes(a.toLowerCase())) || email.toLowerCase().includes('harshil');
      let isPro = isMasterAdmin;
      let licenseKey = isMasterAdmin ? 'SHADOW-PRO-HARSHIL-ADMIN' : '';

      const urlParams = new URLSearchParams(window.location.search);
      const clientHwid = (urlParams.get('hwid') || '').toUpperCase().trim();
      let hwidBlocked = false;

      if (!isMasterAdmin) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/licenses?customer_email=eq.${encodeURIComponent(email)}&is_active=eq.true&select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
          const rows = await res.json();
          if (Array.isArray(rows) && rows.length > 0) {
            const row = rows[0];
            const createdDate = new Date(row.created_at);
            const diffDays = (new Date() - createdDate) / (1000 * 60 * 60 * 24);
            const isMonthly = !row.plan_tier || row.plan_tier === 'PRO_MONTHLY';
            const isExpired = isMonthly && diffDays >= 30;

            if (!isExpired) {
              const boundHwid = (row.bound_hwid || '').toUpperCase().trim();

              if (clientHwid) {
                // Check if already bound to another PC
                if (boundHwid && !boundHwid.startsWith('ORDER') && boundHwid !== clientHwid) {
                  // Mismatch! Account is locked to another computer
                  isPro = false;
                  hwidBlocked = true;
                } else if (!boundHwid || boundHwid.startsWith('ORDER')) {
                  // First login or reset! Lock to this PC's HWID
                  await fetch(`${SUPABASE_URL}/rest/v1/licenses?customer_email=eq.${encodeURIComponent(email)}`, {
                    method: 'PATCH',
                    headers: {
                      'apikey': SUPABASE_KEY,
                      'Authorization': `Bearer ${SUPABASE_KEY}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ bound_hwid: clientHwid, last_used_at: new Date().toISOString() })
                  });
                  isPro = true;
                  licenseKey = row.license_key;
                } else {
                  // Matches bound hardware
                  isPro = true;
                  licenseKey = row.license_key;
                }
              } else {
                isPro = true;
                licenseKey = row.license_key;
              }
            } else {
              console.log('Customer license reached 30-day expiration period.');
            }
          }
        } catch(e) {
          console.warn('License lookup error:', e);
        }
      }

      if (hwidBlocked) {
        userTier.className = 'tier-badge tier-free';
        userTier.style.background = 'rgba(255,71,87,0.2)';
        userTier.style.color = '#ff4757';
        userTier.style.border = '1px solid #ff4757';
        userTier.innerText = '🔒 DEVICE LIMIT (1 PC ONLY)';
        statusMsg.innerHTML = '<span style="color:#ff4757;font-weight:bold;">❌ DEVICE MISMATCH:</span> This account is locked to another computer. Licenses are valid for 1 PC only.<br>To switch devices, contact admin to unbind HWID.';
        return;
      }

      if (isPro) {
        userTier.className = 'tier-badge tier-pro';
        userTier.innerText = 'PRO ACTIVE [UNLIMITED]';
      } else {
        userTier.className = 'tier-badge tier-free';
        userTier.innerText = 'COMMUNITY TIER [FREE]';

        // Auto-register new Desktop Google user in database so admin sees them in Admin Terminal
        if (!isMasterAdmin) {
          fetch(`${SUPABASE_URL}/rest/v1/licenses`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              customer_email: email.toLowerCase().trim(),
              plan_tier: 'COMMUNITY_FREE',
              is_active: false,
              bound_hwid: clientHwid || null,
              license_key: 'FREE-COMMUNITY'
            })
          }).catch(() => {});
        }
      }

      let cloudKey = '';
      try {
        const sysRes = await fetch(`${SUPABASE_URL}/rest/v1/licenses?customer_email=eq.system@shadowai.local&select=*`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const sysRows = await sysRes.json();
        if (Array.isArray(sysRows) && sysRows.length > 0) {
          cloudKey = sysRows[0].bound_hwid || '';
        }
      } catch(e) {
        console.warn('Could not fetch cloud key from Supabase:', e);
      }

      // Relay session to desktop app
      const callbackUrl = `http://127.0.0.1:${port}/callback?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar)}&is_pro=${isPro ? '1' : '0'}&license_key=${encodeURIComponent(licenseKey)}&cloud_key=${encodeURIComponent(cloudKey)}`;

      statusMsg.innerHTML = '<span class="spinner"></span> Connecting to running ShadowAI Desktop...';

      // Send GET to local desktop server
      try {
        await fetch(callbackUrl, { mode: 'no-cors' });
      } catch(e) {}

      // Also navigate browser to callback or show confirmation
      setTimeout(() => {
        window.location.href = callbackUrl;
      }, 400);
    }

    async function initSession() {
      if (!supabaseClient) return;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          handleAuthenticatedUser(session.user);
        }
      } catch(err) {
        console.warn('Session check failed:', err);
      }
    }

    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
          handleAuthenticatedUser(session.user);
        }
      });
    }

    initSession();
  </script>
</body>
</html>
