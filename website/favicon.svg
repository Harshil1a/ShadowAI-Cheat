<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Tactical Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear & Radial Gradients -->
    <linearGradient id="cyber-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00b347" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f17" />
      <stop offset="50%" stop-color="#060f0c" />
      <stop offset="100%" stop-color="#020504" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 255, 102, 0.4)" />
      <stop offset="70%" stop-color="rgba(0, 229, 255, 0.1)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background Tactical Hexagon Base -->
  <rect width="512" height="512" rx="110" fill="#030508" />
  
  <!-- Outer Cyber Armor Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="url(#shield-grad)" stroke="url(#cyber-green)" stroke-width="6" stroke-opacity="0.5" />
  
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#core-glow)" />

  <!-- Tactical Corner Reticle Accents -->
  <path d="M 64 120 L 64 64 L 120 64" fill="none" stroke="#00ff66" stroke-width="8" stroke-linecap="round" />
  <path d="M 448 120 L 448 64 L 392 64" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" />
  <path d="M 64 392 L 64 448 L 120 448" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" />
  <path d="M 448 392 L 448 448 L 392 448" fill="none" stroke="#00ff66" stroke-width="8" stroke-linecap="round" />

  <!-- Central Stealth AI Emblem (Stylized Angular 'S' / Stealth Visor Wings) -->
  <g filter="url(#neon-glow)">
    <!-- Upper Wing / Visor Top -->
    <path d="M 140 190 L 256 120 L 372 190 L 340 226 L 256 175 L 172 226 Z" 
          fill="url(#cyber-green)" />

    <!-- Center Radar Diamond Aperture -->
    <polygon points="256,200 316,256 256,312 196,256" 
             fill="#040a08" 
             stroke="#00e5ff" 
             stroke-width="8" />

    <!-- Pulsing Cyan Core Pupil -->
    <circle cx="256" cy="256" r="26" fill="url(#cyber-cyan)" filter="url(#neon-glow)" />
    <circle cx="256" cy="256" r="10" fill="#ffffff" />

    <!-- Horizontal Stealth Scanner Laser Slit -->
    <line x1="120" y1="256" x2="196" y2="256" stroke="#00ff66" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <line x1="316" y1="256" x2="392" y2="256" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" opacity="0.85" />

    <!-- Lower Wing / Stealth Shield Keel -->
    <path d="M 172 286 L 256 337 L 340 286 L 372 322 L 256 392 L 140 322 Z" 
          fill="url(#cyber-green)" />
  </g>
</svg>
