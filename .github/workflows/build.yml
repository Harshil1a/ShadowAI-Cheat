name: Build ShadowAI (macOS DMG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal Bundle (.dmg)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'

      - name: Configure CMake (macOS)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS App
        run: |
          cd build
          cmake --build . --config Release

      - name: Package macOS DMG
        run: |
          cd build
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          echo "Found app bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          # Deploy Qt frameworks without creating DMG first
          macdeployqt "$APP_PATH" -always-overwrite
          echo "Ad-hoc code signing the complete bundle to stabilize macOS TCC ScreenCapture permissions..."
          codesign --force --deep -s - "$APP_PATH"
          # Create DMG using hdiutil
          hdiutil create -volname "AudioService" -srcfolder "$APP_PATH" -ov -format UDZO AudioService.dmg
          DMG_PATH=$(pwd)/AudioService.dmg
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "Created DMG: $DMG_PATH"

      - name: Deploy DMG to website/downloads
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          echo "Deploying DMG from $DMG_PATH..."
          cp "$DMG_PATH" website/downloads/AudioService.dmg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f website/downloads/AudioService.dmg
          git diff --cached --quiet || git commit -m "ci: auto-deploy fresh macOS DMG [skip ci]"
          git push origin master

      - name: Upload macOS Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: AudioService-macOS-DMG
          path: build/**/*.dmg
          if-no-files-found: warn
