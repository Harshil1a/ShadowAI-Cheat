name: Build ShadowAI (macOS DMG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal Bundle (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'

      - name: Configure CMake (macOS)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS App
        run: |
          cd build
          cmake --build . --config Release

      - name: Package macOS DMG
        run: |
          cd build
          macdeployqt bin/ShadowAI.app -dmg -always-overwrite || true
          DMG_PATH=$(find . -name "*.dmg" | head -1)
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "Found DMG: $DMG_PATH"

      - name: Deploy DMG to website/downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cp "$DMG_PATH" website/downloads/ShadowAI.dmg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/downloads/ShadowAI.dmg
          git diff --cached --quiet || git commit -m "ci: auto-deploy fresh macOS DMG [skip ci]"
          git push origin master

      - name: Upload macOS Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowAI-macOS-DMG
          path: build/**/*.dmg
          if-no-files-found: warn
