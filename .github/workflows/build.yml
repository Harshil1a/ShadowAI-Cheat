name: Build ShadowAI (macOS DMG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal Bundle (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'

      - name: Configure CMake (macOS)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build macOS App
        run: |
          cd build
          cmake --build . --config Release

      - name: Package macOS DMG
        run: |
          cd build
          macdeployqt bin/ShadowAI.app -dmg -always-overwrite || true
          find . -name "*.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowAI-macOS-DMG
          path: build/**/*.dmg
          if-no-files-found: warn

